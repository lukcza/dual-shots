<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141C"/>
      <stop offset="100%" stop-color="#08080C"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>

    <!-- Lens Glass Gradient -->
    <linearGradient id="lensGlass" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#2A2A38" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#101018" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#222230" stroke-width="3"/>

  <!-- Subtle Outer Ring / Aura -->
  <circle cx="230" cy="256" r="148" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="4 8"/>

  <!-- PRIMARY MAIN LENS (Large) -->
  <!-- Outer metallic bevel -->
  <circle cx="224" cy="256" r="130" fill="url(#lensGlass)" stroke="#2C2C3C" stroke-width="6"/>
  <!-- Gold aperture ring -->
  <circle cx="224" cy="256" r="112" fill="none" stroke="url(#goldGrad)" stroke-width="10" filter="url(#goldGlow)"/>
  <!-- Inner optical glass -->
  <circle cx="224" cy="256" r="88" fill="#0C0C14" stroke="#3A3A4C" stroke-width="3"/>

  <!-- Aperture Blades (Minimal Geometric Lines) -->
  <g stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
    <line x1="224" y1="168" x2="278" y2="218" />
    <line x1="278" y1="218" x2="270" y2="290" />
    <line x1="270" y1="290" x2="204" y2="310" />
    <line x1="204" y1="310" x2="152" y2="264" />
    <line x1="152" y1="264" x2="168" y2="198" />
    <line x1="168" y1="198" x2="224" y2="168" />
  </g>
  <!-- Center Pupil Reflection -->
  <circle cx="224" cy="256" r="26" fill="url(#goldGrad)" opacity="0.9"/>
  <circle cx="216" cy="248" r="6" fill="#FFFFFF" opacity="0.8"/>

  <!-- SECONDARY PiP LENS (Floating Offset) -->
  <!-- Drop Shadow backing -->
  <rect x="290" y="270" width="138" height="138" rx="36" fill="#06060A" opacity="0.7"/>
  <!-- PiP Card Border -->
  <rect x="286" y="266" width="138" height="138" rx="36" fill="#181824" stroke="#FFFFFF" stroke-width="6"/>
  
  <!-- PiP Inner Selfie Lens -->
  <circle cx="355" cy="335" r="44" fill="#0A0A12" stroke="url(#goldGrad)" stroke-width="5"/>
  <circle cx="355" cy="335" r="24" fill="#1C1C28" stroke="#3A3A4C" stroke-width="2"/>
  <!-- Selfie camera glint -->
  <circle cx="355" cy="335" r="10" fill="url(#goldGrad)"/>
  <circle cx="351" cy="331" r="3" fill="#FFFFFF"/>

  <!-- Top Flash Dot Indicator -->
  <circle cx="385" cy="120" r="10" fill="#FFB800" filter="url(#goldGlow)"/>
</svg>
