name: dual_shots
description: "A professional Dual Shot camera Flutter application built with Clean Architecture, supporting concurrent multi-camera capture, pseudo-dual fallback, draggable PiP UI, and background isolate image stitching."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.0
  
  # Camera & Hardware
  camera: ^0.10.6
  permission_handler: ^11.3.0
  
  # Image Processing & Filesystem
  image: ^4.2.0
  path_provider: ^2.1.2
  path: ^1.9.0
  uuid: ^4.3.3
  
  # Sharing
  share_plus: ^10.0.0

  # UI & Utilities
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  tutorial_coach_mark: ^1.2.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.3
  bloc_test: ^9.1.5

flutter:
  uses-material-design: true
